name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (core only, no optional protocols)
        run: pip install -e ".[dev]"

      # Run once without ncclient or httpx installed. The extras are optional
      # by design, so a core install has to work — and the NETCONF transport
      # has to be absent cleanly rather than half-present.
      - name: Safety gates on a core install
        run: pytest tests/unit -v

      - name: Install the optional protocol extras
        run: pip install -e ".[dev,netconf,gnmi,vault]"

      - name: Safety gates with every optional protocol available
        run: pytest tests/unit -v

      # The lab is the point: integration tests drive real FRR routers over
      # real SSH. Nothing here is mocked.
      - name: Start FRR lab
        run: |
          docker compose -f lab/docker-compose.yml up -d --build
          for i in $(seq 1 60); do
            nc -z localhost 2211 && nc -z localhost 2212 \
              && nc -z localhost 2213 && nc -z localhost 2214 && exit 0
            sleep 1
          done
          echo "lab failed to start"; docker compose -f lab/docker-compose.yml logs; exit 1

      - name: Integration tests against the lab
        run: pytest tests/integration -v

      # These two are not in the fast lab: netopeer2 builds four C libraries
      # from source. They are the only things that prove confirmed-commit and
      # streaming telemetry, neither of which FRR can do.
      - name: Start the NETCONF and gNMI nodes
        run: |
          docker compose -f lab/docker-compose.yml --profile full up -d --build netconf1 gnmi1
          for i in $(seq 1 90); do
            nc -z localhost 2230 && nc -z localhost 57400 && exit 0
            sleep 1
          done
          echo "protocol nodes failed to start"
          docker compose -f lab/docker-compose.yml --profile full logs netconf1 gnmi1
          exit 1

      - name: NETCONF and gNMI tests
        run: pytest tests/integration/test_netconf.py tests/integration/test_gnmi.py -v

      - name: Tear down
        if: always()
        run: docker compose -f lab/docker-compose.yml --profile full down -v
