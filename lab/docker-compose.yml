# NetNerd integration lab: two eBGP-peered FRR routers reachable over real SSH.
# `make lab` brings this up; the integration tests drive it via NetNerd's own
# SSHDriver + tools — no mocking, per the project's testing convention.
#
# Every published port is pinned to 127.0.0.1. Docker's default is 0.0.0.0,
# which would put a router with a published throwaway password on every
# interface of the host — and these containers are privileged, so reaching one
# is reaching root. Nothing outside this machine needs to talk to the lab.
name: netnerd-lab

services:
  r1:
    build: ./frr
    container_name: netnerd-lab-r1
    hostname: r1
    privileged: true
    volumes:
      # Seeded, not bind-mounted onto /etc/frr/frr.conf: `write memory` renames
      # the live file before writing it, and a bind-mounted file cannot be
      # renamed ("Resource busy") even as root, with or without :ro. The
      # entrypoint copies this into place so saving works and the repo's copy
      # stays clean.
      - ./frr/r1/frr.conf:/seed/frr.conf:ro
      - ./frr/daemons:/etc/frr/daemons:ro
    ports:
      - "127.0.0.1:2211:22"
    networks:
      labnet:
        ipv4_address: 172.30.0.2

  r2:
    build: ./frr
    container_name: netnerd-lab-r2
    hostname: r2
    privileged: true
    volumes:
      - ./frr/r2/frr.conf:/seed/frr.conf:ro
      - ./frr/daemons:/etc/frr/daemons:ro
    ports:
      - "127.0.0.1:2212:22"
    networks:
      labnet:
        ipv4_address: 172.30.0.3

  # A real NETCONF server, so the NETCONF transport has something standards-
  # compliant to run against. FRR speaks only an IOS-like CLI.
  #
  # Nokia SR Linux was the first choice — a real router with NETCONF and gNMI
  # in one node — but it needs containerlab's network-namespace setup and its
  # net_inst_mgr aborts under plain docker-compose, so NETCONF and gNMI never
  # bind. netopeer2 is CESNET's reference implementation, which is arguably a
  # better thing to test a client against: passing here means the transport is
  # standards-compliant rather than compatible with one vendor's quirks.
  #
  # Behind the `full` profile because it builds from source (no published
  # arm64 image) and `make lab` should stay fast. `make lab-full` brings it up.
  netconf1:
    build: ./netconf
    container_name: netnerd-lab-netconf1
    hostname: netconf1
    profiles: ["full"]
    ports:
      - "127.0.0.1:2230:830"
    networks:
      labnet:
        ipv4_address: 172.30.0.4

  # A gNMI target, for the same reason netconf1 exists: nothing else in the
  # lab speaks the protocol, and shipping a transport on the strength of the
  # spec alone is how this project has never found a bug.
  #
  # google/gnxi is the reference implementation from the gNMI authors, so
  # passing against it means standards-compliant rather than merely compatible
  # with one vendor. Go, so unlike netopeer2 it builds in seconds.
  gnmi1:
    build: ./gnmi
    container_name: netnerd-lab-gnmi1
    hostname: gnmi1
    profiles: ["full"]
    ports:
      - "127.0.0.1:57400:57400"
    networks:
      labnet:
        ipv4_address: 172.30.0.5

  # Two more routers, so a staged fleet rollout has enough devices for stages
  # to mean anything. Same FRR image as r1/r2, so `make lab` stays fast.
  #
  # On their own subnet rather than labnet: an address on 172.30.0.0/24 makes a
  # node a subnet-neighbour of r1, which would widen r1's blast radius and
  # break the topology tests that assert exactly which device a cut strands.
  # A separate group of devices is also what a fleet actually looks like.
  r3:
    build: ./frr
    container_name: netnerd-lab-r3
    hostname: r3
    privileged: true
    volumes:
      - ./frr/r3/frr.conf:/seed/frr.conf:ro
      - ./frr/daemons:/etc/frr/daemons:ro
    ports:
      - "127.0.0.1:2213:22"
    networks:
      fleetnet:
        ipv4_address: 172.31.0.3

  r4:
    build: ./frr
    container_name: netnerd-lab-r4
    hostname: r4
    privileged: true
    volumes:
      - ./frr/r4/frr.conf:/seed/frr.conf:ro
      - ./frr/daemons:/etc/frr/daemons:ro
    ports:
      - "127.0.0.1:2214:22"
    networks:
      fleetnet:
        ipv4_address: 172.31.0.4

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  fleetnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
