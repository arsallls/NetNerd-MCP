frr version 10.2
frr defaults traditional
hostname r2
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.2.2.2/32
!
router bgp 65002
 bgp router-id 10.2.2.2
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 description to-r1
 !
 address-family ipv4 unicast
  network 10.2.2.2/32
  neighbor 172.30.0.2 activate
 exit-address-family
!
router ospf
 ospf router-id 10.2.2.2
 network 172.30.0.0/24 area 0
!
line vty
!
