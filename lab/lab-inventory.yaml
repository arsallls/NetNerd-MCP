# Inventory for the local FRR lab (make lab). Throwaway credentials.
#
# These routers run FRR, not Cisco IOS. device_type is cisco_ios because that
# is the netmiko driver that speaks to FRR's vtysh (same prompts, same enable,
# same `conf t`), and netmiko has no FRR driver. Expect IOS-only commands like
# `show interfaces brief` to be rejected by the device — that is FRR being FRR,
# not the inventory being wrong.
devices:
  r1:
    host: localhost
    port: 2211
    device_type: cisco_ios
    username: netnerd
    password: netnerd123
    writable: true
  r2:
    host: localhost
    port: 2212
    device_type: cisco_ios
    username: netnerd
    password: netnerd123
    writable: false   # left read-only so the allowlist gate is exercised

  # Fleet targets. A staged rollout needs more than one writable device, and
  # r2 has to stay read-only for the allowlist gate test — so the fleet is
  # [r1, r3, r4]. These two sit on their own subnet (see docker-compose.yml)
  # so they do not widen r1's blast radius.
  r3:
    host: localhost
    port: 2213
    device_type: cisco_ios
    username: netnerd
    password: netnerd123
    writable: true

  r4:
    host: localhost
    port: 2214
    device_type: cisco_ios
    username: netnerd
    password: netnerd123
    writable: true

  # r1's Linux side, reached with an ordinary shell instead of vtysh. FRR has
  # no ntc-templates coverage, so this is the node that proves server-side
  # parsing works over real SSH — `ip route show` and friends do have
  # templates. Also the "Linux network node" the spec's lab section asks for.
  r1-shell:
    host: localhost
    port: 2211
    device_type: linux
    username: netshell
    password: netnerd123
    writable: false

  # A real NETCONF server (make lab-full). Not a router — it exists so the
  # NETCONF transport, and specifically RFC 6241 confirmed-commit, runs
  # against a standards-compliant implementation instead of being taken on
  # trust. Its config is IETF YANG data, so changes here are XML, not CLI.
  netconf1:
    host: localhost
    port: 2230
    device_type: netconf
    protocols: [netconf]
    username: netnerd
    password: netnerd123
    writable: true

  # A gNMI target (make lab-full). Read-only here: gNMI Set exists but the
  # change loop's rollback story is NETCONF's confirmed-commit, so writes stay
  # on the transports that can undo themselves.
  gnmi1:
    host: localhost
    port: 57400
    device_type: gnmi
    protocols: [gnmi]
    username: netnerd
    password: netnerd123
    writable: false
